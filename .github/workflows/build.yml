# Release builds, made only from a vX.Y.Z tag pushed by hand; the tag is the version everywhere.
# Produces a Debian package (built on Debian stable, verified to install on Debian and Ubuntu), a
# generic tarball from the same binary, and an Arch package, and attaches them to a GitHub release.
name: release

on:
  push:
    tags: ['v*']

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          test "$(git describe --tags --exact-match)" = "$GITHUB_REF_NAME" || { echo "HEAD is not at the tag"; exit 1; }
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "a release for $GITHUB_REF_NAME already exists; delete it first if this is intentional"; exit 1
          fi
          test "$(make -s version)" = "$GITHUB_REF_NAME"
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  debian:
    needs: version
    runs-on: ubuntu-latest
    container: rust:1-trixie
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config cmake libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libpipewire-0.3-dev libclang-dev libgbm-dev libegl-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: cargo-bins/cargo-binstall@v1.22.0
      - run: cargo binstall -y cargo-deb
      - name: Debian package and tarball
        run: |
          make package-deb package-tar
          test "$(target/release/elsewhere --version)" = "elsewhere ${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: debian
          path: |
            dist/*.deb
            dist/*.tar.gz

  # The .deb built on Debian stable must install and start on Debian and on the Ubuntu releases we
  # care about (glibc and GStreamer versions differ).
  install-test:
    needs: [version, debian]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:trixie', 'ubuntu:24.04', 'ubuntu:latest']
    container: ${{ matrix.image }}
    env:
      ELSEWHERE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: debian
      - run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./elsewhere_*.deb curl
          sh scripts/check-release.sh "$ELSEWHERE_VERSION"

  arch:
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed cargo nodejs npm gstreamer gst-plugins-base gst-plugins-good \
            gst-plugins-bad gst-plugin-va mesa libxkbcommon libpipewire clang git
          useradd -m builder
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - name: makepkg
        env:
          PACKAGER: Ryan Petris <ryan@petris.net>
        run: |
          chown -R builder .
          su builder -c 'PACKAGER="$PACKAGER" make package-arch'
          test "$(target/release/elsewhere --version)" = "elsewhere ${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: dist/*.pkg.tar*

  release:
    needs: [debian, install-test, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
